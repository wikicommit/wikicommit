[project]
# This version declares only this development repository's own Python package,
# which exists to pull in the dependencies needed to run this repository's
# scripts and tests (`pyyaml` below, plus the `dev` extra) and to hold the
# [tool.ruff] settings. **It is not WikiCommit's version**, and it is
# deliberately not kept in sync with it (Issue #577 / #799): `packages = []`
# below means this is not a distributed package, nothing in the repository
# reads this `version`, and what bumps WikiCommit's version — a change to a
# type template or a page generation rule — has nothing to do with the
# dependency and lint declarations here. WikiCommit's own version lives in
# `.claude/skills/wikicommit-init/scripts/templates/scripts/_version.py` and
# `.claude-plugin/plugin.json`; the two are held equal by
# `tests/test_version_sync.py`. Expect this number to sit well behind them.
name = "wikicommit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.setuptools]
packages = []

[tool.ruff]
extend-exclude = [
    ".claude/skills/wikicommit-init/scripts/templates/scripts",
]

[tool.ruff.lint]
# ruff's own default rule set as of 0.15.x (E4, E7, E9, F). Pinned explicitly
# so that future ruff releases enabling additional default categories (e.g.
# RUF/UP/PLW, as happened between 0.15 and 0.16) cannot turn CI red without a
# deliberate opt-in here. See Issue #469.
select = ["E4", "E7", "E9", "F"]
