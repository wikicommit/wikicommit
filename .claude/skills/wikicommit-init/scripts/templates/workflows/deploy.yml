name: Deploy to GitHub Pages

# Issue #351: `on.push.branches` only accepts static glob patterns, not
# expressions — GitHub evaluates it before a workflow run (and therefore
# before ${{ }} context values are available), so the repository's actual
# default branch (which may not be `main`, e.g. an existing repository still
# on `master`) cannot be substituted in here. Instead this triggers on push
# to any branch and the `build` job's `if:` below narrows it at runtime to
# the actual default branch via github.event.repository.default_branch.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install dependencies
        run: npm install

      - name: Set baseUrl for GitHub Pages
        run: |
          BASE_URL="$(echo '${{ steps.pages.outputs.base_url }}' | sed -e 's#https\?://##' -e 's#/$##')"
          sed -i "s#baseUrl: .*#baseUrl: ${BASE_URL}#" quartz.config.yaml

      - name: Build Quartz site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
