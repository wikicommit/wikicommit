# yaml-language-server: $schema=./quartz/quartz/plugins/quartz-plugins.schema.json
#
# Quartz v5 configuration. These are the initial values /wikicommit-init wrote.
# Quartz v5 itself is not distributed as an npm package, so it has to be pulled
# into quartz/ as a git submodule:
#   git submodule add https://github.com/jackyzha0/quartz.git quartz
# See the README or .github/workflows/deploy.yml for details.
configuration:
  # These two carry the same site name. **Do not change only one of them.**
  # They reach the reader in different places, so setting just one leaves the
  # name missing from the other:
  #   pageTitle       -> the left sidebar heading and OGP's og:site_name
  #   pageTitleSuffix -> the browser tab (<title>), og:title, twitter:title
  # Quartz's own Head.tsx builds <title> from nothing but "the page's frontmatter
  # title + this suffix", so an empty suffix means no tab on the site shows the
  # site name at all (the top page would read just "Wiki").
  pageTitle: {PAGE_TITLE}
  pageTitleSuffix: {PAGE_TITLE_SUFFIX}
  enableSPA: true
  enablePopovers: true
  analytics: null
  # The language of the site chrome (sidebar, search, graph, language-switcher
  # headings). `/wikicommit-init` derives it from `primary_lang` (Issue #771).
  # **Page bodies, the banner, the sources box and the properties box do not
  # follow this value** -- those read each page's own frontmatter `lang`
  # (Issue #378). On a multilingual wiki that leaves a mix: a translated page's
  # body is in the reader's language while the chrome around it stays in the
  # original language. A site can hold only one locale, and three of the plugins
  # that draw the chrome (explorer / graph / search) cannot switch per page, so
  # this is not solvable from configuration.
  locale: {LOCALE}
  baseUrl: localhost:8080
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: relative
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: ../quartz-plugins/wikicommit-jsonld
    enabled: true
    order: 75
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    # Disabled by default: baseUrl is run in the <owner>.github.io/<repo> form
    # (a GitHub Pages project page), so emitting a CNAME file for a custom domain
    # here would register baseUrl's hostname (<owner>.github.io) as the custom
    # domain and break the project page's URLs (everything under /<repo>).
    # Enable this only when you are actually using a custom domain.
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # The stock explorer (github:quartz-community/explorer) cannot solve, from YAML,
  # the problem that Type directories stay hidden unless the `<lang>` segment is
  # expanded (Issue #196) -- for the same reason as breadcrumbs: anything like
  # filterFn/mapFn requires a TypeScript override in quartz.ts, and this project
  # deliberately keeps quartz.config.yaml as its only configuration surface.
  # At the time of Issue #196 the explorer was left out of scope as too risky to
  # fork, being a large stateful interactive component (folder collapse,
  # localStorage persistence, an inline script, i18n across 30+ locales)
  # (p3-055 / Issue #209). Investigation then showed that the filterFn/mapFn
  # framework cannot express the operation at all -- "lift one folder's children
  # up to its parent" (filter deletes whole subtrees, map only alters a single
  # node) -- which settled that forking was the only option. The fork itself, like
  # breadcrumbs, keeps upstream's collapse state, localStorage keys (derived from
  # node.slug, unchanged by the fold) and inline-script contract intact, and adds
  # exactly one thing after the tree is built: lifting only the current page's
  # `<lang>` folder's children up to the parent (foldCurrentLangSegment in
  # wikicommit-explorer.inline.ts; other languages' folders stay collapsed as
  # before and can still be expanded and browsed). Hence the
  # `wikicommit-explorer` fork.
  - source: ../quartz-plugins/wikicommit-explorer
    enabled: true
    layout:
      position: left
      priority: 50
  # The stock graph's (github:quartz-community/graph) D3Config is exactly
  # drag / zoom / depth / scale / repelForce / centerForce / linkDistance /
  # fontSize / opacityScale / removeTags / showTags / focusOnHover / enableRadial
  # -- no per-page exclusion, no language filter, no type filter, no degree
  # filter. And these are baked into a data-cfg attribute as JSON at build time,
  # so they cannot be changed from the UI either. On a multilingual wiki this
  # produces one cluster per language, with language-neutral tags becoming the
  # only bridge between them and hubbing so hard that other links are buried --
  # observed in the `ai-driven-dev-wiki` pilot (Issue #584).
  # The 808-line graph.inline.ts holds the D3 force simulation and PixiJS itself,
  # but the choke point for narrowing (after the neighbourhood is settled, before
  # nodes are built) sits in a single place, and the config is re-read inside
  # renderGraph() on every render -- so it is enough to insert a filter there,
  # rewrite data-cfg and re-render.
  # The control bar is shown only on the global graph (the local graph builds its
  # neighbourhood by BFS with depth >= 0, so removing elements afterwards would
  # cut paths and strand nodes).
  - source: ../quartz-plugins/wikicommit-graph
    enabled: true
    layout:
      position: right
      priority: 10
  # The stock search (github:quartz-community/search) has no YAML option for
  # adding a hint about the #tag syntax to the search box placeholder
  # (SearchOptions is only enablePreview/fieldPriority -- Issue #312). AND-style
  # narrowing with #tag works as a standard feature; all that was missing was a
  # one-line change reusing the existing tagFilterHint locale string (already
  # defined for all 30 locales, for the tag autocomplete dropdown) in the
  # placeholder as well. So the 957-plus-line search.inline.ts (the FlexSearch
  # index and the search UI itself) is untouched, and only Search.tsx's
  # placeholder assembly is forked.
  - source: ../quartz-plugins/wikicommit-search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: ../quartz-plugins/wikicommit-banner
    enabled: true
    layout:
      position: beforeBody
      priority: 12
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: ../quartz-plugins/wikicommit-language-switcher
    enabled: true
    layout:
      position: left
      priority: 8
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # Neither the stock explorer nor the stock breadcrumbs has a YAML option for
  # hiding the `<lang>` segment (anything like filterFn/mapFn requires a
  # TypeScript override in quartz.ts, and this project deliberately keeps
  # quartz.config.yaml as its only configuration surface), so both are replaced
  # by forks that strip only the `<lang>` segment: wikicommit-breadcrumbs and
  # wikicommit-explorer (the left nav -- see the comment on the
  # `../quartz-plugins/wikicommit-explorer` entry above. At the time of
  # Issue #196 the explorer was out of scope because it is a large stateful
  # interactive component; it was taken on later in Issue #209).
  - source: ../quartz-plugins/wikicommit-breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: ../quartz-plugins/wikicommit-sources
    enabled: true
    layout:
      position: afterBody
      priority: 5
  # giscus — a place for the thought a reader is not yet sure enough about to
  # open an Issue over (Issue #741). Three layers, and they do not overlap:
  #
  #   noticing  → here. Anyone, any number of times, no confidence required.
  #   reporting → the banner's report link, which opens an Issue. Needs
  #               confidence that something should be fixed.
  #   declaring → closing a review-tracking Issue. Needs write access.
  #
  # The gap this fills is real and not decorative: cross-page contradictions
  # between pages generated in different batches are, by design, out of reach of
  # every automated check — so the only thing in the system holding two pages at
  # once is a person who read one last week and the other today. That thought
  # arrives as "these don't quite agree", which is not an Issue.
  #
  # DISABLED BY DEFAULT, and turning it on takes four values this template
  # deliberately does not ship as empty keys — a placeholder nobody fills is
  # worse than an absent one. See the wikicommit-init SKILL.md section
  # "Enabling comments (giscus)" for how to obtain them.
  #
  # Prerequisites, all three of them giscus's own:
  #   - the repository is PUBLIC (otherwise visitors cannot see the discussion)
  #   - the giscus GitHub App is installed on it (otherwise they cannot post)
  #   - Discussions is turned on
  # Use an ANNOUNCEMENTS-type Discussion category: giscus recommends it because
  # only maintainers and giscus itself can then open new discussions there.
  #
  # Reactions and discussions are deliberately NOT wired to review_status. A 👍
  # means "this was good", not "I read this and had nothing to report"; there is
  # no principled threshold on a running count for a two-valued field; closing a
  # tracking Issue requires write access and this would not; and a discussion
  # only exists once someone reacts, so "pages nobody has looked at yet" would
  # stop being listable. This axis measures how far a page reached, and is kept
  # apart from whether it reached anyone at all.
  #
  # To enable: set enabled to true and fill in the four values below.
  #
  #   options:
  #     provider: giscus
  #     options:
  #       repo: <owner>/<repo>
  #       repoId: <the repository's GraphQL node ID>
  #       category: <the Discussion category's name>
  #       categoryId: <that category's GraphQL node ID>
  #       lang: <the reader-facing UI language>
  #
  # `lang` is a single static value (default en) and does not follow a page's
  # own `lang` frontmatter, so on a multilingual wiki it will not match every
  # reader. primary_lang is the sensible choice.
  #
  # Build-generated navigation pages are already excluded two ways, and both are
  # needed. The ones WikiCommit writes carry `comments: false` in their own
  # frontmatter; the ones Quartz synthesises have no .md to stamp, so `comments`
  # is listed in layout.byPageType.folder/tag.exclude below — that covers the
  # language tops (/ja/ and the like, which get no index.md) and every tag page.
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      # init.py fills the GitHub entry below in with this repository's own URL, so
      # the footer link lands on the wiki the reader is looking at rather than on
      # upstream Quartz (Issue #557) — the same treatment pageTitle gets above. When
      # no GitHub remote can be resolved it drops the entry instead, leaving an empty
      # mapping. Quartz's own attribution is rendered by the footer plugin itself and
      # is unaffected either way. Edit the URL here if the remote later changes.
      links:
        GitHub: {REPO_URL}
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  # Forked from github:quartz-community/note-properties as wikicommit-properties
  # (Issue #509), same as wikicommit-explorer/wikicommit-search/wikicommit-banner/
  # wikicommit-sources above — self-vendored instead of resolved from the
  # external quartz-community org at build time. This plugin is Quartz's
  # actual frontmatter parser (not just the properties panel display), so it
  # must not be disabled. The only behavioral change from upstream is that
  # `properties`, WikiCommit's nested Schema.org property block
  # (Issue #495), is now flattened into
  # individual rows instead of rendering as one raw JSON dump — see
  # getVisibleProperties() in wikicommit-properties/src/transformer.ts.
  - source: ../quartz-plugins/wikicommit-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
        - properties
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    # folder and tag pages are generated by Quartz itself from content/'s
    # directory structure and the pages' tags; no corresponding .md is ever
    # written out for them. The navigation pages WikiCommit does write (the root
    # index, content/sources/, the per-Type indexes) suppress the banner by
    # stamping review_status: reviewed at write time (Issues #407 / #476 / #580),
    # but for these two there is no writer to do the stamping -- so
    # WikiCommitBanner's review_status fallback (pending when unset, a deliberate
    # choice that fails safe when an LLM-generated page omits the field) kicks in
    # and prints "this page is unreviewed / generated automatically by an LLM"
    # on a machine-generated index. The always-on report link does the same,
    # inviting readers to report problems with a table of contents.
    # Deciding the page kind inside the component is not the approach taken --
    # WikiCommitBanner is written not to depend on Quartz slug-naming conventions
    # such as fileData.slug === "index", and doing it entirely in layout
    # configuration is consistent with that (Issue #648).
    #
    # comments (giscus) belongs here for the same reason (Issue #741). Among the
    # build-generated navigation pages, the ones WikiCommit writes a .md for (the
    # per-Type indexes, the per-view indexes, the root index, content/sources/,
    # content/overview/) suppress it by stamping comments: false into the
    # frontmatter at write time -- but **for these two there is no writer to do
    # the stamping**. In particular no index.md is written for content/<lang>/,
    # so a language top page (/ja/ and the like) is a folder page Quartz
    # synthesizes and has no frontmatter at all; the same goes for tag pages
    # (/tags/<tag>). Left alone, a comment box would appear on exactly the
    # machine-generated tables of contents this exclusion is here to avoid.
    folder:
      exclude:
        - reader-mode
        - wikicommit-banner
        - comments
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - wikicommit-banner
        - comments
      positions:
        right: []
    canvas: {}
    bases: {}
