# yaml-language-server: $schema=./quartz/quartz/plugins/quartz-plugins.schema.json
#
# Quartz v5 設定ファイル。/wikicommit-init が生成した初期値です。
# Quartz v5 本体は npm パッケージとして配布されていないため、
# git submodule として quartz/ に取り込む必要があります:
#   git submodule add https://github.com/jackyzha0/quartz.git quartz
# 詳細は README または .github/workflows/deploy.yml を参照してください。
configuration:
  # これら 2 つは同じサイト名を持ちます。**片方だけ変えないでください。**
  # 別々の場所に届くため、どちらか一方では読者に名前が伝わりません:
  #   pageTitle       → 左サイドバーの見出しと OGP の og:site_name
  #   pageTitleSuffix → ブラウザのタブ（<title>）・og:title・twitter:title
  # Quartz 本体の Head.tsx は <title> を「そのページの frontmatter title + この
  # suffix」だけで組み立てるため、suffix が空だとどのページのタブにも
  # サイト名が出ません（トップページなら "Wiki" とだけ表示されます）。
  pageTitle: {PAGE_TITLE}
  pageTitleSuffix: {PAGE_TITLE_SUFFIX}
  enableSPA: true
  enablePopovers: true
  analytics: null
  # サイト全体の chrome（サイドバー・検索・グラフ・言語切り替えの見出し）の言語を決める
  # 値。`/wikicommit-init` が `primary_lang` から導出して書き込む（Issue #771）。
  # **ページ本文とバナー・出典欄・properties 欄はこの値に従わない** — そちらは各ページの
  # frontmatter の `lang` を見る（Issue #378）。したがって多言語 Wiki では、翻訳ページの
  # 本文は読者の言語・その周りの chrome は原文言語、という混在が残る。locale は 1 サイトに
  # 1 つしか持てず、chrome を描くプラグインのうち 3 つ（explorer / graph / search）は
  # ページ単位に切り替えられないため、これは設定では解けない。
  locale: {LOCALE}
  baseUrl: localhost:8080
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: relative
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: ../quartz-plugins/wikicommit-jsonld
    enabled: true
    order: 75
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    # デフォルトは無効: baseUrl は <owner>.github.io/<repo> 形式（GitHub Pages のプロジェクトページ）で
    # 運用するため、ここでカスタムドメイン用の CNAME ファイルを発行すると
    # baseUrl のホスト名（<owner>.github.io）がカスタムドメインとして誤登録され、
    # プロジェクトページの URL（/<repo> 配下）が壊れる。カスタムドメインを使う場合のみ有効化すること。
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # 素の explorer（github:quartz-community/explorer）は breadcrumbs と同じ理由
  # （filterFn/mapFn 相当のカスタマイズは quartz.ts の TypeScript override 必須。
  # 本プロジェクトは quartz.config.yaml のみを設定面として使う設計のため導入しない）で、
  # `<lang>` セグメントを展開しないと Type ディレクトリが見えない問題を YAML からは
  # 解決できない（Issue #196）。Issue #196 時点では、explorer は状態を持つ大規模な
  # 対話コンポーネント（フォルダ折りたたみ・localStorage 永続化・インラインスクリプト・
  # 30+ ロケール i18n）でフォークのリスクが高いとしてスコープ外にしていたが（p3-055 /
  # Issue #209）、調査の結果 filterFn/mapFn の枠組みでは「あるフォルダの子を親に
  # 繰り上げる」操作自体を表現できない（filter は部分木ごと削除、map はノード単体の
  # 変更のみ）ことが判明し、そもそもフォーク以外に選択肢がないと確定した。フォーク自体は
  # breadcrumbs と同じくアップストリームの折りたたみ状態・localStorage キー
  # （node.slug 由来。畳み込み後も変更なし）・インラインスクリプトの契約を保ったまま、
  # ツリー構築後に現在ページの `<lang>` フォルダの子だけを親へ繰り上げる処理
  # （wikicommit-explorer.inline.ts の foldCurrentLangSegment。他言語のフォルダは
  # 従来どおり畳まれた状態で残り、展開すればブラウズできる）を1箇所追加するだけで
  # 済んだため、`wikicommit-explorer` としてフォークした。
  - source: ../quartz-plugins/wikicommit-explorer
    enabled: true
    layout:
      position: left
      priority: 50
  # 素の graph（github:quartz-community/graph）の D3Config は
  # drag / zoom / depth / scale / repelForce / centerForce / linkDistance /
  # fontSize / opacityScale / removeTags / showTags / focusOnHover / enableRadial が
  # すべてで、ページ単位の除外・言語フィルタ・型フィルタ・次数フィルタをいずれも
  # 持たない。しかもこれらはビルド時に data-cfg 属性へ JSON として焼き込まれるため
  # UI から変えられない。多言語 Wiki では言語ごとに塊ができ、言語中立な tags が
  # その塊を繋ぐ唯一の橋としてハブ化して他のリンクを埋もれさせる、という症状が
  # `ai-driven-dev-wiki` パイロットで実際に確認された（Issue #584）。
  # 808行の graph.inline.ts には D3 force simulation / PixiJS 本体があるが、
  # 絞り込みのチョークポイント（neighbourhood 確定後・nodes 構築前）が1箇所に
  # 集約されており、設定も renderGraph() の中で毎回読み直されるため、
  # そこへフィルタを差し込み data-cfg を書き換えて再レンダーするだけで済む。
  # グローバルグラフにのみコントロールバーを出す（ローカルグラフは depth >= 0 の
  # BFS で neighbourhood を組むため、後から要素を削ると経路が切れて孤児が残る）。
  - source: ../quartz-plugins/wikicommit-graph
    enabled: true
    layout:
      position: right
      priority: 10
  # 素の search（github:quartz-community/search）は #tag 構文のヒントを検索ボックスの
  # プレースホルダーに追加する YAML オプションを持たない（SearchOptions は
  # enablePreview/fieldPriority のみ。Issue #312）。#tag によるAND絞り込み自体は
  # 標準機能で動作するが、既存の tagFilterHint ロケール文字列（タグ自動補完ドロップダウン用に
  # 全30ロケールへ既に定義済み）をプレースホルダーにも再利用する1行の差分のみで済むため、
  # 957行超の search.inline.ts（FlexSearch インデックス・検索UI本体）には一切手を入れず
  # Search.tsx のプレースホルダー組み立て処理のみをフォークした。
  - source: ../quartz-plugins/wikicommit-search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: ../quartz-plugins/wikicommit-banner
    enabled: true
    layout:
      position: beforeBody
      priority: 12
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: ../quartz-plugins/wikicommit-language-switcher
    enabled: true
    layout:
      position: left
      priority: 8
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # 素の explorer/breadcrumbs はどちらも `<lang>` セグメントを非表示にする YAML オプションを
  # 持たない（filterFn/mapFn 相当のカスタマイズは quartz.ts の TypeScript override 必須。
  # 本プロジェクトは quartz.config.yaml のみを設定面として使う設計のため導入しない）ため、
  # どちらも `<lang>` セグメントのみを取り除くフォークに置き換える。breadcrumbs は
  # wikicommit-breadcrumbs、explorer は wikicommit-explorer（左ナビ側。上の
  # `../quartz-plugins/wikicommit-explorer` エントリのコメント参照。Issue #196 時点では
  # 状態を持つ大規模な対話コンポーネントであることを理由にスコープ外にしていたが、
  # 後に Issue #209 で対応した）。
  - source: ../quartz-plugins/wikicommit-breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: ../quartz-plugins/wikicommit-sources
    enabled: true
    layout:
      position: afterBody
      priority: 5
  # giscus — a place for the thought a reader is not yet sure enough about to
  # open an Issue over (Issue #741). Three layers, and they do not overlap:
  #
  #   noticing  → here. Anyone, any number of times, no confidence required.
  #   reporting → the banner's report link, which opens an Issue. Needs
  #               confidence that something should be fixed.
  #   declaring → closing a review-tracking Issue. Needs write access.
  #
  # The gap this fills is real and not decorative: cross-page contradictions
  # between pages generated in different batches are, by design, out of reach of
  # every automated check — so the only thing in the system holding two pages at
  # once is a person who read one last week and the other today. That thought
  # arrives as "these don't quite agree", which is not an Issue.
  #
  # DISABLED BY DEFAULT, and turning it on takes four values this template
  # deliberately does not ship as empty keys — a placeholder nobody fills is
  # worse than an absent one. See the wikicommit-init SKILL.md section
  # "Enabling comments (giscus)" for how to obtain them.
  #
  # Prerequisites, all three of them giscus's own:
  #   - the repository is PUBLIC (otherwise visitors cannot see the discussion)
  #   - the giscus GitHub App is installed on it (otherwise they cannot post)
  #   - Discussions is turned on
  # Use an ANNOUNCEMENTS-type Discussion category: giscus recommends it because
  # only maintainers and giscus itself can then open new discussions there.
  #
  # Reactions and discussions are deliberately NOT wired to review_status. A 👍
  # means "this was good", not "I read this and had nothing to report"; there is
  # no principled threshold on a running count for a two-valued field; closing a
  # tracking Issue requires write access and this would not; and a discussion
  # only exists once someone reacts, so "pages nobody has looked at yet" would
  # stop being listable. This axis measures how far a page reached, and is kept
  # apart from whether it reached anyone at all.
  #
  # To enable: set enabled to true and fill in the four values below.
  #
  #   options:
  #     provider: giscus
  #     options:
  #       repo: <owner>/<repo>
  #       repoId: <the repository's GraphQL node ID>
  #       category: <the Discussion category's name>
  #       categoryId: <that category's GraphQL node ID>
  #       lang: <the reader-facing UI language>
  #
  # `lang` is a single static value (default en) and does not follow a page's
  # own `lang` frontmatter, so on a multilingual wiki it will not match every
  # reader. primary_lang is the sensible choice.
  #
  # Build-generated navigation pages are already excluded two ways, and both are
  # needed. The ones WikiCommit writes carry `comments: false` in their own
  # frontmatter; the ones Quartz synthesises have no .md to stamp, so `comments`
  # is listed in layout.byPageType.folder/tag.exclude below — that covers the
  # language tops (/ja/ and the like, which get no index.md) and every tag page.
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      # init.py fills the GitHub entry below in with this repository's own URL, so
      # the footer link lands on the wiki the reader is looking at rather than on
      # upstream Quartz (Issue #557) — the same treatment pageTitle gets above. When
      # no GitHub remote can be resolved it drops the entry instead, leaving an empty
      # mapping. Quartz's own attribution is rendered by the footer plugin itself and
      # is unaffected either way. Edit the URL here if the remote later changes.
      links:
        GitHub: {REPO_URL}
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  # Forked from github:quartz-community/note-properties as wikicommit-properties
  # (Issue #509), same as wikicommit-explorer/wikicommit-search/wikicommit-banner/
  # wikicommit-sources above — self-vendored instead of resolved from the
  # external quartz-community org at build time. This plugin is Quartz's
  # actual frontmatter parser (not just the properties panel display), so it
  # must not be disabled. The only behavioral change from upstream is that
  # `properties`, WikiCommit's nested Schema.org property block
  # (Issue #495), is now flattened into
  # individual rows instead of rendering as one raw JSON dump — see
  # getVisibleProperties() in wikicommit-properties/src/transformer.ts.
  - source: ../quartz-plugins/wikicommit-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
        - properties
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    # folder / tag は Quartz 自身が content/ のディレクトリ構造とページの tags から
    # 生成するページで、対応する .md の実体がどこにも書き出されない。WikiCommit が
    # 書き出すナビゲーションページ（root index・content/sources/・Type 別インデックス）は
    # 書き出し側で review_status: reviewed をスタンプすることでバナーを抑止しているが
    # （Issue #407・#476・#580）、この2種にはスタンプする書き出し側が存在しないため、
    # WikiCommitBanner の review_status フォールバック（未設定なら pending。LLM 生成
    # ページでの書き漏れを安全側へ倒すための意図的な設計）が効いて「⚠️ このページは
    # 未レビューです / LLM が自動生成しました」が機械生成の目次に表示される。常時表示の
    # 報告リンクも同様に、目次に対して「この内容に問題があれば報告」を出してしまう。
    # コンポーネント側でページ種別を判定する案は採らない — WikiCommitBanner は
    # fileData.slug === "index" のような Quartz のスラッグ命名規約に依存しない方針で
    # 書かれており、レイアウト設定だけで完結するこちらが整合する（Issue #648）。
    #
    # comments（giscus）も同じ理由でここに置く（Issue #741）。ビルド生成のナビゲーション
    # ページのうち WikiCommit が .md を書き出すもの（Type 別インデックス・view 別
    # インデックス・root index・content/sources/・content/overview/）は書き出し側で
    # frontmatter に comments: false をスタンプして抑止しているが、**この2種には
    # スタンプする書き出し側が存在しない** — とくに content/<lang>/ には index.md を
    # 書き出さないため、言語トップ（/ja/ 等）は Quartz が合成する folder ページになり、
    # frontmatter を持たない。tag ページ（/tags/<tag>）も同様。放置すると、まさに
    # 除外したかった機械生成の目次にコメント欄が並ぶ。
    folder:
      exclude:
        - reader-mode
        - wikicommit-banner
        - comments
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - wikicommit-banner
        - comments
      positions:
        right: []
    canvas: {}
    bases: {}
